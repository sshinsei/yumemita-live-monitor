[project]
name = "yumemita-live-monitor"
version = "0.1.0"
description = "Slim YouTube live discovery + concurrent-viewer sampling with X schedule hints"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yumemita_live_monitor"]

# uv: install dev tools (pytest) by default with `uv sync`
[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
